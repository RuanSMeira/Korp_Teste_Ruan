<div class="w-full flex justify-between items-center font-['Outfit']">
  <div class="flex flex-col items-start gap-1">
    <h1 class="text-[#111827] text-[28px] font-extrabold">{{ title }}</h1>
    <p class="text-[#4B5563] text-sm">{{ subtitle }}</p>
  </div>

  <div class="flex items-center gap-5">
    <div class="w-60 pl-4 pr-4 py-2.5 bg-white rounded-full border border-[#E5E7EB] flex items-center gap-2">
      <svg class="w-[18px] h-[18px] text-[#9CA3AF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <span class="text-[#9CA3AF] text-sm">Buscar no Korp...</span>
    </div>

    <button type="button" class="p-2.5 bg-white rounded-full border border-[#E5E7EB] hover:bg-gray-50 transition-colors">
      <svg class="w-[18px] h-[18px] text-[#4B5563]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
    </button>

    <div class="p-1.5 bg-white rounded-full border border-[#E5E7EB] flex items-center gap-2.5">
      <img [src]="avatarUrl" alt="" class="w-8 h-8 rounded-full" />
      <span class="text-[#111827] text-sm font-semibold pr-1">{{ userName }}</span>
    </div>
  </div>
</div>
