<div class="flex flex-col gap-2 mb-8">
  <h2 class="text-[#111827] text-[28px] font-extrabold tracking-tight">Acesse sua conta</h2>
  <p class="text-[#4B5563] text-[15px]">Insira suas credenciais corporativas abaixo para entrar no ecossistema Korp ERP.</p>
</div>

<form [formGroup]="loginUsuarioForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  
  <div class="flex flex-col gap-2">
    <label class="text-[#111827] text-sm font-semibold">E-mail</label>
    <input type="email" formControlName="email" placeholder="colaborador@viasoft.com.br" 
      class="h-12 px-4 bg-[#F8FAFC] border border-[#E5E7EB] rounded-lg text-[15px] focus:outline-none focus:border-[#E11A55] transition-all" />
  </div>

  <div class="flex flex-col gap-2">
    <label class="text-[#111827] text-sm font-semibold">Sua Senha</label>
    <div class="relative w-full">
      <input type="password" formControlName="senha" placeholder="••••••••" 
        class="h-12 px-4 w-full bg-[#F8FAFC] border border-[#E5E7EB] rounded-lg text-[15px] focus:outline-none focus:border-[#E11A55] transition-all" />
      
      <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#4B5563] hover:text-[#111827] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      </button>
    </div>
  </div>

  <div class="flex justify-end">
    <!-- Link de esqueci a senha (pode direcionar para a rota de recuperação no futuro) -->
    <a href="#" class="text-[#E11A55] text-sm font-semibold hover:underline">Esqueci minha senha</a>
  </div>

  <button type="submit" class="w-full bg-[#E11A55] text-white py-3.5 rounded-lg font-bold shadow-[0_4px_12px_rgba(225,26,85,0.20)] hover:bg-rose-700 transition-colors mt-2">
    Entrar no Sistema
  </button>
</form>

<div class="flex justify-center items-center gap-1.5 mt-6">
  <span class="text-[#4B5563] text-sm">Não tem uma conta?</span>
  <!-- Link direcionando para o cadastro correto -->
  <a routerLink="/auth/cadastro-usuario" class="text-[#E11A55] text-sm font-bold hover:underline cursor-pointer">Cadastre-se</a>
</div>
