<div class="flex min-h-screen bg-[#F8FAFC] font-['Outfit'] text-[#111827]">
  
  <!-- SIDEBAR FIXA -->
  <aside class="w-[280px] flex-shrink-0 bg-[#101423] border-r border-[#2E3B5E] p-8 flex flex-col justify-between">
    <div class="flex flex-col gap-12">
      <!-- Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-8 bg-[#E11A55] rounded-md flex justify-center items-center text-white text-xl font-extrabold">K</div>
        <div class="flex flex-col gap-0.5">
          <div class="flex items-baseline gap-1">
            <span class="text-white text-[22px] font-extrabold">KORP</span>
            <span class="text-[#E11A55] text-sm font-semibold">ERP</span>
          </div>
          <span class="text-[#9CA3AF] text-[9px] font-semibold uppercase tracking-widest">by Viasoft</span>
        </div>
      </div>

      <!-- Menus (Usando routerLink e routerLinkActive para marcar o menu selecionado) -->
      <nav class="flex flex-col gap-2">
        <div class="text-[#9CA3AF] text-[11px] font-bold uppercase mb-2">Navegação Principal</div>
        
        <a routerLink="/app/cadastrar-produto" routerLinkActive="bg-[#E11A55] font-bold text-white" [routerLinkActiveOptions]="{exact: false}"
           class="px-4 py-3 rounded-lg flex items-center gap-3 text-sm text-[#9CA3AF] font-medium hover:bg-white/5 transition-colors cursor-pointer no-underline">
          <div class="w-[18px] h-[18px] border-2 border-current rounded-[3px] opacity-70"></div>
          <span class="flex-1">Cadastrar Produto</span>
        </a>

        <a routerLink="/app/painel-empresa" routerLinkActive="bg-[#E11A55] font-bold text-white"
           class="px-4 py-3 rounded-lg flex items-center gap-3 text-sm text-[#9CA3AF] font-medium hover:bg-white/5 transition-colors cursor-pointer no-underline">
          <div class="w-[18px] h-[18px] border-2 border-current rounded-[3px] opacity-70"></div>
          <span class="flex-1">Painel da Empresa</span>
        </a>

        <a routerLink="/app/faturamento" routerLinkActive="bg-[#E11A55] font-bold text-white"
           class="px-4 py-3 rounded-lg flex items-center gap-3 text-sm text-[#9CA3AF] font-medium hover:bg-white/5 transition-colors cursor-pointer no-underline">
          <div class="w-[18px] h-[18px] border-2 border-current rounded-[3px] opacity-70"></div>
          <span class="flex-1">Serviço de Faturamento</span>
        </a>
      </nav>
    </div>

    <!-- Empresa e Logout -->
    <div class="flex flex-col gap-5">
      <div class="h-px bg-[#2E3B5E] w-full"></div>
      <div class="p-2 bg-[#1A1F35] rounded-xl flex items-center gap-3">
        <div class="w-10 h-10 bg-[#E11A55] rounded-lg flex justify-center items-center text-white text-lg font-extrabold">V</div>
        <div class="flex flex-col flex-1">
          <span class="text-white text-sm font-bold">Viasoft Matriz</span>
          <span class="text-[#9CA3AF] text-[11px]">CNPJ: 00.000.000/0001-00</span>
        </div>
      </div>
      <!-- Sugestão: adicione routerLink="/auth/login" no botão sair para simular o logout -->
      <a routerLink="/auth/login" class="flex items-center gap-3 pl-4 bg-transparent border-none text-[#9CA3AF] hover:text-white transition-colors cursor-pointer no-underline">
        <div class="w-[18px] h-[18px] border-2 border-current rounded-[3px] opacity-70"></div>
        <span class="text-sm font-semibold">Sair do Sistema</span>
      </a>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL DA APLICAÇÃO -->
  <main class="flex-1 relative flex flex-col pt-6 px-10 pb-10 overflow-y-auto h-screen">
    
    <!-- HEADER FIXO NO TOPO DIREITO (Busca e Usuário) -->
    <header class="absolute right-10 top-6 flex items-center gap-5 z-10">
      <div class="flex items-center gap-2 bg-white px-4 py-2.5 rounded-full border border-[#E5E7EB] w-[240px]">
        <div class="w-[18px] h-[18px] border-2 border-[#9CA3AF] rounded-[3px] opacity-70"></div>
        <input type="text" placeholder="Buscar no Korp..." class="bg-transparent border-none outline-none text-sm text-[#111827] placeholder-[#9CA3AF] w-full">
      </div>
      
      <button class="p-2.5 bg-white border border-[#E5E7EB] rounded-full cursor-pointer hover:bg-gray-50 transition-colors">
        <div class="w-[18px] h-[18px] border-2 border-[#4B5563] rounded-[3px] opacity-70"></div>
      </button>
      
      <div class="flex items-center gap-2.5 p-1.5 pr-4 bg-white border border-[#E5E7EB] rounded-full cursor-pointer hover:bg-gray-50 transition-colors">
        <img src="https://placehold.co/32x32" alt="Avatar" class="w-8 h-8 rounded-full">
        <span class="text-sm font-semibold text-[#111827]">Ana Silva</span>
      </div>
    </header>

    <!-- É AQUI QUE AS TELAS VÃO RENDERIZAR (O Título fica dentro do componente filho para não ficar por baixo do Header absoluto) -->
    <div class="mt-20"> <!-- Margem no topo para empurrar o conteúdo pra baixo do Header -->
      <router-outlet></router-outlet>
    </div>
    
  </main>
</div>
